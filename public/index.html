<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Recommendations</title>
<style>
  :root{--bg:#faf7f5;--card:#fff;--ink:#1f1a24;--mute:#6b6475;--line:#e8e2e6;--brand:#6a2c91;--brand-soft:#f1e8f7;
        --ok:#1d7a4d;--ok-soft:#e3f4eb;--warn:#a15c07;--warn-soft:#fdf0dc;--bad:#a33;--bad-soft:#fbe6e6}
  @media (prefers-color-scheme:dark){:root{--bg:#17131b;--card:#221c28;--ink:#f1ecf4;--mute:#a79fb0;--line:#362e3e;--brand:#c79bec;--brand-soft:#33263f;
        --ok:#6fd3a0;--ok-soft:#183427;--warn:#f0b865;--warn-soft:#3a2d14;--bad:#f08a8a;--bad-soft:#3b1d1d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:28px 16px 8px;max-width:920px;margin:auto}
  h1{margin:0;font-size:26px;letter-spacing:-.01em} h1 span{color:var(--brand)}
  .sub{color:var(--mute);margin:4px 0 0}
  main{max-width:920px;margin:auto;padding:8px 16px 56px}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
  label{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
  #user{min-width:260px;max-width:100%} .chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute);padding-bottom:10px}
  .member{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .member h2{margin:0 0 2px;font-size:18px} .member p{margin:2px 0;color:var(--mute);font-size:14px}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin-right:6px;background:var(--brand-soft);color:var(--brand)}
  .badge.cold{background:var(--warn-soft);color:var(--warn)}
  .note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:16px}
  .card{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .rank{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
  .card h3{margin:0;font-size:19px} .topic{color:var(--brand);font-weight:600;font-size:14px}
  .why{font-size:15px;margin:10px 0;padding:10px 12px;background:var(--brand-soft);border-radius:10px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .pill{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
  .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:13px;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
  .chip b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-right:5px}
  .similar{font-size:13px;color:var(--mute);margin-top:10px}
  .lead{font-size:13px;color:var(--mute);margin-top:4px}
  details{margin-top:10px;font-size:13px;color:var(--mute)} summary{cursor:pointer}
  .bars{display:grid;grid-template-columns:90px 1fr 40px;gap:4px 8px;align-items:center;margin-top:8px}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
  .excl{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;margin-top:20px;font-size:14px}
  .excl .why-no{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad)}
  .skeleton,.err{padding:24px;text-align:center;color:var(--mute)} .err{color:var(--bad)}
  @media(max-width:520px){.card{grid-template-columns:1fr}.rank{width:36px;height:36px}}
</style>
</head>
<body>
<header>
  <h1>Circle <span>Recommendations</span></h1>
  <p class="sub">Pick a member to see which Circles we'd suggest, and why.</p>
</header>
<main>
  <div class="controls">
    <div><label for="user">Member</label><select id="user" aria-label="Member"></select></div>
    <div><label for="limit">How many</label><select id="limit"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div>
    <label class="chk"><input type="checkbox" id="debug"> Show scoring and excluded Circles</label>
  </div>
  <div id="member"></div>
  <div id="out"><div class="skeleton">Loading…</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const FORMAT = { in_person: "In person", virtual: "Virtual", hybrid: "Hybrid" };
const TYPE = { interest: "Your interest", profile: "Your profile", membership: "Your Circles", peers: "Members like you", activity: "Activity", welcoming: "Welcoming", availability: "Availability", join: "Joining", popular: "Popular" };
let users = [];

async function init() {
  try {
    users = await (await fetch("/users")).json();
    const planted = users.filter((u) => u.scenario);
    const opt = (u) => `<option value="${u.id}">${esc(u.first_name)} ${esc(u.last_name)} (#${u.id})${u.scenario ? " — " + u.scenario : ""}</option>`;
    $("user").innerHTML = `<optgroup label="Test scenarios">${planted.map(opt).join("")}</optgroup>` +
      `<optgroup label="All members">${users.filter((u) => !u.scenario).map(opt).join("")}</optgroup>`;
    $("user").value = 23;
    load();
  } catch (e) { $("out").innerHTML = `<div class="err">Couldn't reach the API. Is the server running?</div>`; }
}

async function load() {
  const id = $("user").value, u = users.find((x) => x.id == id);
  $("out").innerHTML = `<div class="skeleton">Finding Circles…</div>`;
  try {
    const res = await fetch(`/users/${id}/recommendations?limit=${$("limit").value}&debug=${$("debug").checked ? 1 : 0}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error);
    render(u, data);
  } catch (e) { $("out").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function render(u, d) {
  const mode = d.personalization.mode;
  const modeText = { personalized: "Personalized from stated interests", inferred: "Inferred from profile and Circles", cold_start: "Cold start: nothing known yet" }[mode];
  $("member").innerHTML = `<div class="member">
    <h2>${esc(u.first_name)} ${esc(u.last_name)}</h2>
    <p>${esc([u.job_title, u.industry, u.location].filter(Boolean).join(" · ") || "No profile details yet")}</p>
    <p>${u.bio ? "“" + esc(u.bio) + "”" : ""}</p>
    <p>Interests: <b>${esc(u.interests || "none selected")}</b> · Already in ${u.circles_joined} Circle${u.circles_joined == 1 ? "" : "s"}</p>
    <p style="margin-top:8px"><span class="badge ${mode === "cold_start" ? "cold" : ""}">${modeText}</span></p></div>
    ${d.personalization.note ? `<div class="note">${esc(d.personalization.note)}</div>` : ""}`;

  $("out").innerHTML = d.recommendations.map(card).join("") + (d.debug ? excluded(d.debug) : "");
}

function card(r) {
  const c = r.circle;
  const spots = c.spots_left == null ? `<span class="pill">No member cap</span>` :
    `<span class="pill ${c.spots_left <= 3 ? "warn" : ""}">${c.spots_left} spot${c.spots_left == 1 ? "" : "s"} left</span>`;
  const lead = c.leaders[0] ? `<div class="lead">Led by ${esc(c.leaders[0].name)}${c.leaders[0].job_title ? ", " + esc(c.leaders[0].job_title) : ""}</div>` : "";
  const sim = r.similar_circles.length ? `<div class="similar">Also similar: ${r.similar_circles.map((s) => esc(s.name)).join(", ")}</div>` : "";
  const dbg = r.debug ? `<details><summary>Why this score (${r.score})</summary><div class="bars">${
    Object.entries(r.debug.components).map(([k, v]) => `<span>${k}</span><div class="bar"><i style="width:${Math.round(v * 100)}%"></i></div><span>${v}</span>`).join("")}</div></details>` : "";
  return `<article class="card"><div class="rank">${r.rank}</div><div>
    <h3>${esc(c.name)}</h3>
    <div class="topic">${esc(c.topic_label || "Community Circle")}</div>
    <div class="why">${esc(r.explanation)}</div>
    <div class="meta">
      <span class="pill">${FORMAT[c.format]}</span>
      <span class="pill">${c.member_count} members</span>${spots}
      <span class="pill ${c.join_policy === "open" ? "ok" : ""}">${c.join_policy === "open" ? "Open to join" : "Join by request"}</span>
    </div>
    <div class="chips">${r.reasons.map((x) => `<span class="chip"><b>${TYPE[x.type] || x.type}</b>${esc(x.text)}</span>`).join("")}</div>
    ${lead}${sim}${dbg}</div></article>`;
}

function excluded(dbg) {
  const label = { full: "Full", inactive: "Inactive", unlisted: "Unlisted", already_member: "Already a member" };
  return `<div class="excl"><b>Circles we deliberately left out</b><br>${dbg.excluded.map((e) => `<span class="why-no">#${e.id} ${esc(e.name)}: ${label[e.reason] || e.reason}</span>`).join("")}</div>`;
}

$("user").onchange = $("limit").onchange = $("debug").onchange = load;
init();
</script>
</body>
</html>
